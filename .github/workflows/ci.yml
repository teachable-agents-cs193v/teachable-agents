# Runs on every pull request and on pushes to main. Needs no repository secrets.
# The steps mirror `npm run check` in package.json; keep the two in sync.
# (They're separate steps so the Actions UI shows which check failed.)
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR or branch cancels the run it makes outdated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # TODO(#20): read from .nvmrc once the Node version is declared
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Scans the full git history for secrets with the same config as the local
  # hooks, so it also catches commits from anyone who hasn't installed them.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Downloads gitleaks and verifies its checksum (see .githooks/install.sh).
      - run: sh .githooks/install.sh
      - run: .githooks/bin/gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
